<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <script>
        if (window.location.pathname === '/public/index.html') {
            document.querySelector('base').href = '/public/';
        }
    </script>
    <script src="js/ui/theme-init.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/image-lyrics.css">
    <link rel="stylesheet" href="assets/css/video-fonts.css?v=20261003-video-lyrics-grid-upload">
    <link rel="stylesheet" href="assets/css/video-lyrics.css?v=20261003-video-lyrics-grid-upload">
    <link rel="stylesheet" href="assets/css/video-prompter.css?v=20261003-video-lyrics-grid-upload">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <title>EC Lyrics</title>
</head>

<body>
    <div id="auth-gate-mount"></div>

    <div id="block-source-dialog" class="block-source-dialog" hidden role="dialog" aria-modal="true"
        aria-labelledby="block-source-dialog-title">
        <div class="block-source-dialog__backdrop" id="block-source-dialog-backdrop" tabindex="-1"></div>
        <div class="block-source-dialog__card">
            <header class="block-source-dialog__head">
                <div class="block-source-dialog__title-wrap">
                    <h3 id="block-source-dialog-title">Add lyrics to block</h3>
                </div>
                <button type="button" class="block-source-dialog__close" id="block-source-dialog-close"
                    aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </header>
            <div class="block-source-body" id="block-source-body">
                <p class="block-source-dialog__lede">Search by title, hymn number, lyrics, or adaptation source.</p>
                <label class="visually-hidden" for="block-source-search">Search song library</label>
                <div class="block-source-search-wrap">
                    <i class="fa-solid fa-magnifying-glass block-source-search-icon" aria-hidden="true"></i>
                    <input type="search" id="block-source-search" class="block-source-search"
                        placeholder="Search song library…" autocomplete="off" />
                </div>
                <div id="block-source-filters" class="block-source-filters" role="group"
                    aria-label="Filter by category"></div>
                <ul id="block-source-results" class="block-source-results" role="listbox"
                    aria-label="Song search results"></ul>
                <p class="block-source-library-note" id="block-source-library-note" role="status" aria-live="polite">Loading song library…</p>
                <div class="block-source-alt">
                    <span class="block-source-alt__rule" aria-hidden="true">or</span>
                    <button type="button" class="block-source-option" id="block-source-type" data-block-source="type">
                        <span class="block-source-option__icon" aria-hidden="true"><i
                                class="fa-solid fa-keyboard"></i></span>
                        <span class="block-source-option__text">
                            <span class="block-source-option__title">Manually type</span>
                            <span class="block-source-option__hint">Title line, blank line, then lyrics</span>
                        </span>
                        <span class="block-source-option__chevron" aria-hidden="true"><i
                                class="fa-solid fa-chevron-right"></i></span>
                    </button>
                    <button type="button" class="block-source-option" id="block-source-paste" data-block-source="paste">
                        <span class="block-source-option__icon" aria-hidden="true"><i
                                class="fa-solid fa-paste"></i></span>
                        <span class="block-source-option__text">
                            <span class="block-source-option__title">Paste lyrics</span>
                            <span class="block-source-option__hint"> Clipboard / Ctrl + V </span>
                        </span>
                        <span class="block-source-option__chevron" aria-hidden="true"><i
                                class="fa-solid fa-chevron-right"></i></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="app-shell app-shell--gated" id="app-shell" inert aria-hidden="true">
        <script>
            (function () {
                var shell = document.getElementById('app-shell');
                if (shell && window.matchMedia('(max-width: 1200px)').matches) {
                    shell.classList.add('sidebar-compact');
                }
            })();
        </script>
        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <div class="sidebar-brand">
                <div class="sidebar-brand-row">
                    <div class="sidebar-brand-text">
                        <h1>EC Lyrics</h1>
                        <p class="sidebar-tagline">Lyric prompt and preview.</p>
                    </div>
                    <button type="button" class="sidebar-pin-btn" id="sidebar-toggle" title="Collapse sidebar"
                        aria-expanded="true" aria-controls="sidebar">
                        <i class="fa-solid fa-angles-left" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <nav class="sidebar-nav" role="navigation">
                <button type="button" class="is-active" data-panel="text" aria-current="page"
                    aria-label="Text Lyrics">
                    <span class="nav-icon" aria-hidden="true"><i class="fa-solid fa-align-left"></i></span>
                    <span class="nav-label">Text Lyrics</span>
                </button>
                <button type="button" data-panel="image" aria-label="Image Lyrics">
                    <span class="nav-icon" aria-hidden="true"><i class="fa-solid fa-image"></i></span>
                    <span class="nav-label">Image Lyrics</span>
                </button>
                <button type="button" data-panel="video" aria-label="Video Lyrics">
                    <span class="nav-icon" aria-hidden="true"><i class="fa-solid fa-clapperboard"></i></span>
                    <span class="nav-label">[WIP] Video Lyrics</span>
                </button>
                <button type="button" data-panel="admin" aria-label="Admin" id="sidebar-nav-admin" hidden>
                    <span class="nav-icon" aria-hidden="true"><i class="fa-solid fa-shield"></i></span>
                    <span class="nav-label">Admin</span>
                </button>
            </nav>
            <div class="sidebar-utilities" id="sidebar-utilities">
                <span class="sidebar-auth-user" id="auth-user-label" aria-live="polite"></span>
                <button type="button" class="sidebar-utility-btn sidebar-help-btn" id="workspace-tour-btn"
                    title="Help" aria-label="Help">
                    <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                    <span class="sidebar-utility-label">Help</span>
                </button>
                <button type="button" class="sidebar-utility-btn theme-toggle" id="theme-toggle" aria-pressed="false"
                    title="Toggle dark mode" aria-label="Dark mode">
                    <i class="fa-solid fa-moon" aria-hidden="true"></i>
                    <span id="theme-toggle-label" class="sidebar-utility-label">Dark mode</span>
                </button>
                <button type="button" class="sidebar-utility-btn sidebar-auth-out" id="auth-sign-out" hidden
                    title="Sign out" aria-label="Sign out">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span class="sidebar-utility-label">Sign out</span>
                </button>
            </div>
                </aside>

        <div class="workspace-tour" id="workspace-tour-dialog" hidden role="dialog" aria-modal="true"
            aria-labelledby="workspace-tour-title" aria-describedby="workspace-tour-description">
            <div class="workspace-tour__backdrop" id="workspace-tour-backdrop" tabindex="-1"></div>
            <div class="workspace-tour__card">
                <header class="workspace-tour__head">
                    <div>
                        <p class="workspace-tour__eyebrow">Workspace guide</p>
                        <h2 id="workspace-tour-title">Build your first lineup</h2>
                    </div>
                    <button type="button" class="workspace-tour__close" id="workspace-tour-close"
                        aria-label="Close help">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </header>

                <div class="workspace-tour__content">
                    <div class="workspace-tour__visual" id="workspace-tour-visual" aria-hidden="true"></div>
                    <div class="workspace-tour__copy">
                        <p class="workspace-tour__step" id="workspace-tour-step"></p>
                        <div class="workspace-tour__control-definition" id="workspace-tour-control-definition" hidden
                            aria-live="polite"></div>
                        <p class="workspace-tour__description" id="workspace-tour-description"></p>
                    </div>
                </div>

                <footer class="workspace-tour__footer">
                    <div class="workspace-tour__progress" id="workspace-tour-progress" aria-label="Tour progress"></div>
                    <div class="workspace-tour__actions">
                        <button type="button" class="btn-toolbar" id="workspace-tour-prev">Back</button>
                        <button type="button" class="btn-toolbar btn-toolbar-primary" id="workspace-tour-next">Next</button>
                    </div>
                </footer>
            </div>
        </div>

        <div class="app-column">
            <div class="app-main" id="workspace-panels"></div>

            <footer class="app-footer">
                <p>&copy; MCGI Productions EDSA Caloocan · Jeremias 9:24 </p>
            </footer>
        </div>
    </div>



    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <!-- Workspace fragments mount before app scripts bind to their DOM. -->
    <script defer src="js/core/app-bootstrap.js?v=20261003-video-lyrics-grid-upload"></script>
</body>

</html>
